<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Supabase konfiguratsiyasi
const SUPABASE_URL = 'https://qfxbtymrsnyipnmhqgzb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InFmeGJ0eW1yc255aXBubWhxZ2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyODIwOTAsImV4cCI6MjEwNzg1ODA5MH0.aLr0T_VKn_vS6szcdL0QfnivrDNtPkp7_yMmpxO2p6o';

// Elementlarni olish
const $ = id => document.getElementById(id);

let supabase = null;

try {
  if (
    SUPABASE_URL.startsWith('https://') &&
    SUPABASE_ANON_KEY.length > 20
  ) {
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (error) {
  console.error('Supabase initialization failed:', error);
}

const onlineConfigured = Boolean(supabase);

$('connectionStatus').textContent = onlineConfigured
  ? 'Live rooms: configured'
  : 'Online mode: setup required';

// Asosiy holatlar
let games = [];
let draft = [];
let current = null;
let used = [];
let teams = [];
let roomCode = '';
let roomSub = null;
let roomSyncTimer = null;
let sessionRole = 'teacher';
let sessionName = '';
let isSyncing = false;

// Saqlangan o‘yinlarni yuklash
try {
  const saved = JSON.parse(
    localStorage.getItem('quizarena_games') || '[]'
  );

  games = Array.isArray(saved) ? saved : [];
} catch (error) {
  console.error('Saved games could not be loaded:', error);
  games = [];
}

// Umumiy yordamchi funksiyalar
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function makeRoomCode() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

function persist() {
  try {
    localStorage.setItem('quizarena_games', JSON.stringify(games));
  } catch (error) {
    console.error('Saving games failed:', error);
    alert('The game could not be saved in this browser.');
  }

  stats();
}

function stats() {
  $('gameCount').textContent = games.length;

  $('questionCount').textContent = games.reduce(
    (total, game) => total + (game.questions?.length || 0),
    0
  );
}

// Navigatsiya
function nav(page) {
  document.querySelectorAll('main > section').forEach(section => {
    section.classList.add('hidden');
  });

  const target = $('page-' + page);

  if (target) {
    target.classList.remove('hidden');
  }

  document.querySelectorAll('.nav button').forEach(button => {
    button.classList.toggle('active', button.dataset.page === page);
  });

  if (page === 'home') renderHome();
  if (page === 'library') renderLibrary();
  if (page === 'create') renderDraft();
}

document.querySelectorAll('.nav button').forEach(button => {
  button.addEventListener('click', () => nav(button.dataset.page));
});

// O‘yin kartalari
function card(game) {
  return `
    <div class="gamecard">
      <div style="font-size:1.7rem">🎯</div>
      <h3>${esc(game.name)}</h3>
      <div class="muted small">
        ${esc(game.subject || '')} · ${game.questions.length} questions
      </div>
      <div class="small muted">${esc(game.description || '')}</div>
      <div class="actions">
        <button class="primary" data-play="${esc(game.id)}">Play</button>
        <button class="soft" data-edit="${esc(game.id)}">Edit</button>
        <button class="danger" data-del="${esc(game.id)}">Delete</button>
      </div>
    </div>
  `;
}

function wire(root) {
  root.querySelectorAll('[data-play]').forEach(button => {
    button.onclick = () => startGame(button.dataset.play);
  });

  root.querySelectorAll('[data-edit]').forEach(button => {
    button.onclick = () => editGame(button.dataset.edit);
  });

  root.querySelectorAll('[data-del]').forEach(button => {
    button.onclick = () => deleteGame(button.dataset.del);
  });
}

function renderHome() {
  const root = $('homeGames');

  root.innerHTML = games.length
    ? games.slice(0, 3).map(card).join('')
    : '<div class="empty" style="grid-column:1/-1">No games yet. Create your first game.</div>';

  wire(root);
  stats();
}

function renderLibrary() {
  const root = $('libraryGames');

  root.innerHTML = games.length
    ? games.map(card).join('')
    : '<div class="empty" style="grid-column:1/-1">No games yet. Create your first game.</div>';

  wire(root);
}

// O‘yin yaratish
function renderDraft() {
  $('qCount').textContent = draft.length;

  $('draftQuestions').innerHTML = draft.length
    ? draft.map((question, index) => `
        <div class="questionrow">
          <div>
            <b>${index + 1}. ${esc(question.q)}</b>
            <div class="muted small">
              ${esc(question.a)}
              ${question.mediaUrl ? ' · ' + esc(question.mediaType) : ''}
            </div>
          </div>
          <button class="danger" data-rm="${index}">Remove</button>
        </div>
      `).join('')
    : '<div class="empty">No questions added yet.</div>';

  $('draftQuestions').querySelectorAll('[data-rm]').forEach(button => {
    button.onclick = () => {
      draft.splice(Number(button.dataset.rm), 1);
      renderDraft();
    };
  });
}

function resetDraft() {
  $('gameName').value = '';
  $('gameSubject').value = '';
  $('gameDescription').value = '';
  $('qText').value = '';
  $('aText').value = '';
  $('mediaUrl').value = '';
  $('mediaType').value = 'none';

  draft = [];
  $('saveGame').dataset.editing = '';

  renderDraft();
}

function addQuestion() {
  const question = $('qText').value.trim();
  const answer = $('aText').value.trim();
  const mediaType = $('mediaType').value;
  const mediaUrl = $('mediaUrl').value.trim();

  if (!question || !answer) {
    alert('Enter both a question and an answer.');
    return;
  }

  if (mediaUrl && !['image', 'video'].includes(mediaType)) {
    alert('Choose the correct media type.');
    return;
  }

  draft.push({
    q: question,
    a: answer,
    mediaType,
    mediaUrl
  });

  $('qText').value = '';
  $('aText').value = '';
  $('mediaUrl').value = '';
  $('mediaType').value = 'none';

  renderDraft();
}

function saveGame() {
  const name = $('gameName').value.trim();

  if (!name) {
    alert('Enter a game title.');
    return;
  }

  if (!draft.length) {
    alert('Add at least one question.');
    return;
  }

  const editingId = $('saveGame').dataset.editing;

  const game = {
    id: editingId || 'g' + Date.now(),
    name,
    subject: $('gameSubject').value.trim(),
    description: $('gameDescription').value.trim(),
    questions: [...draft]
  };

  if (editingId) {
    games = games.map(item => item.id === editingId ? game : item);
  } else {
    games.unshift(game);
  }

  persist();
  resetDraft();
  nav('library');

  alert('Game saved in this browser.');
}

function editGame(id) {
  const game = games.find(item => item.id === id);

  if (!game) return;

  draft = structuredClone(game.questions);

  $('gameName').value = game.name;
  $('gameSubject').value = game.subject || '';
  $('gameDescription').value = game.description || '';
  $('saveGame').dataset.editing = id;

  renderDraft();
  nav('create');
}

function deleteGame(id) {
  if (!confirm('Delete this game?')) return;

  games = games.filter(game => game.id !== id);

  persist();
  renderHome();
  renderLibrary();
}

$('addQuestion').onclick = addQuestion;
$('saveGame').onclick = saveGame;

$('startCreate').onclick = () => {
  resetDraft();
  nav('create');
};

$('libraryCreate').onclick = () => {
  resetDraft();
  nav('create');
};

$('viewLibrary').onclick = () => nav('library');

// Xona sinxronizatsiyasini to‘xtatish
function stopRoomSync() {
  if (roomSyncTimer) {
    clearInterval(roomSyncTimer);
    roomSyncTimer = null;
  }

  if (roomSub && supabase) {
    supabase.removeChannel(roomSub);
    roomSub = null;
  }
}

// O‘yin boshlash
async function startGame(id) {
  const game = games.find(item => item.id === id);

  if (!game) {
    alert('Game not found.');
    return;
  }

  stopRoomSync();

  current = game;
  used = [];
  teams = [
    { name: 'Team 1', score: 0 },
    { name: 'Team 2', score: 0 }
  ];

  roomCode = makeRoomCode();
  sessionRole = 'teacher';
  sessionName = 'Teacher';

  // Avval mahalliy o‘yinni ko‘rsatamiz
  nav('play');
  renderPlay();

  if (supabase) {
    await createOnlineRoom();
  }
}

// Supabase orqali xona yaratish
async function createOnlineRoom() {
  if (!supabase || !current) return;

  $('roomInfo').textContent = 'Creating online room...';

  try {
    const { data, error } = await supabase
      .from('rooms')
      .insert({
        code: roomCode,
        game: current,
        teams,
        used,
        status: 'active'
      })
      .select()
      .single();

    if (error) throw error;

    roomCode = data.code;
    renderPlay();
    startRoomSync();

    console.log('Room created:', data);
  } catch (error) {
    console.error('Room creation failed:', error);

    $('roomInfo').textContent =
      'Online room could not be created: ' + error.message;
  }
}

// O‘yin ekranini ko‘rsatish
function renderPlay() {
  if (!current) return;

  $('playTitle').textContent = current.name;
  $('playSubject').textContent = current.subject || '';
  $('playDescription').textContent = current.description || '';

  $('teams').innerHTML = teams.map((team, index) => `
    <div class="team">
      <strong>${esc(team.name)}</strong>
      <span class="score">${Number(team.score) || 0}</span>
      <div class="small muted">points</div>
      ${sessionRole === 'teacher' ? `
        <button class="soft" data-minus="${index}">−5</button>
        <button class="soft" data-plus="${index}">+5</button>
      ` : ''}
    </div>
  `).join('');

  $('teams').querySelectorAll('[data-minus]').forEach(button => {
    button.onclick = () => scoreTeam(Number(button.dataset.minus), -5);
  });

  $('teams').querySelectorAll('[data-plus]').forEach(button => {
    button.onclick = () => scoreTeam(Number(button.dataset.plus), 5);
  });

  $('scoreTeam').innerHTML = teams.map((team, index) => `
    <option value="${index}">${esc(team.name)}</option>
  `).join('');

  // O‘quvchilar uchun boshqaruvlarni cheklash
  const isTeacher = sessionRole === 'teacher';

  $('teamName').disabled = !isTeacher;
  $('addTeam').disabled = !isTeacher;
  $('applyScore').disabled = !isTeacher;

  $('copyRoom').classList.toggle('hidden', !isTeacher);

  $('roomInfo').textContent = roomCode
    ? `Room code: ${roomCode} · ${onlineConfigured ? 'Online mode' : 'Local demo mode'}`
    : 'Local demo mode.';

  $('gameBoard').innerHTML = current.questions.map((question, index) => `
    <button
      class="tile ${used.includes(index) ? 'used' : ''}"
      data-tile="${index}"
      ${used.includes(index) ? 'disabled' : ''}
    >
      ${used.includes(index) ? '✓' : index + 1}
      <div style="font-size:.72rem">
        ${used.includes(index) ? 'Completed' : 'Question'}
      </div>
    </button>
  `).join('');

  $('gameBoard').querySelectorAll('[data-tile]').forEach(button => {
    button.onclick = () => {
      if (sessionRole === 'teacher') {
        openQuestion(Number(button.dataset.tile));
      }
    };
  });
}

// Xonadagi holatni serverga yuborish
async function syncRoom() {
  if (!supabase || !roomCode || sessionRole !== 'teacher') {
    return;
  }

  if (isSyncing) return;

  isSyncing = true;

  try {
    const { error } = await supabase
      .from('rooms')
      .update({
        teams,
        used,
        game: current
      })
      .eq('code', roomCode);

    if (error) throw error;
  } catch (error) {
    console.error('Room update failed:', error);
  } finally {
    isSyncing = false;
  }
}

// Xonani muntazam yangilash
function startRoomSync() {
  stopRoomSync();

  if (!supabase || !roomCode) return;

  roomSyncTimer = setInterval(async () => {
    if (sessionRole === 'teacher') {
      await syncRoom();
      return;
    }

    if (sessionRole === 'student') {
      try {
        const { data, error } = await supabase
          .from('rooms')
          .select('game, teams, used, status')
          .eq('code', roomCode)
          .maybeSingle();

        if (error) throw error;

        if (!data || data.status !== 'active') {
          stopRoomSync();
          $('roomInfo').textContent = 'This room is no longer active.';
          return;
        }

        current = data.game;
        teams = data.teams || [];
        used = data.used || [];

        renderPlay();
      } catch (error) {
        console.error('Room synchronization failed:', error);
      }
    }
  }, 2000);
}

// Ballni o‘zgartirish
async function scoreTeam(index, delta) {
  if (sessionRole !== 'teacher' || !teams[index]) return;

  teams[index].score = (Number(teams[index].score) || 0) + delta;

  renderPlay();
  await syncRoom();
}

$('addTeam').onclick = async () => {
  if (sessionRole !== 'teacher') return;

  const name = $('teamName').value.trim();

  if (!name) {
    alert('Enter a team name.');
    return;
  }

  teams.push({ name, score: 0 });

  $('teamName').value = '';

  renderPlay();
  await syncRoom();
};

$('applyScore').onclick = async () => {
  if (sessionRole !== 'teacher') return;

  const index = Number($('scoreTeam').value);
  const delta = Number($('scoreDelta').value);

  if (!teams[index] || !Number.isFinite(delta)) {
    alert('Select a team and enter a valid score.');
    return;
  }

  teams[index].score = (Number(teams[index].score) || 0) + delta;

  renderPlay();
  await syncRoom();
};

// Savol media elementlari
function mediaHTML(question) {
  if (!question.mediaUrl) return '';

  const url = esc(question.mediaUrl);

  if (question.mediaType === 'image') {
    return `
      <img
        class="media"
        src="${url}"
        alt="Question image"
        onerror="this.style.display='none'"
      >
    `;
  }

  if (question.mediaType === 'video') {
    const match = question.mediaUrl.match(
      /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/
    );

    if (match) {
      return `
        <iframe
          class="media"
          height="260"
          src="https://www.youtube-nocookie.com/embed/${match[1]}"
          title="Question video"
          allowfullscreen
        ></iframe>
      `;
    }

    return `
      <video class="media" controls src="${url}"></video>
    `;
  }

  return '';
}

// Savolni ochish
function openQuestion(index) {
  if (sessionRole !== 'teacher' || !current) return;

  const question = current.questions[index];

  if (!question || used.includes(index)) return;

  const root = $('modalRoot');
  let answerVisible = false;

  root.innerHTML = `
    <div class="modalbg">
      <div class="modal">
        <div class="muted small">
          Question ${index + 1} of ${current.questions.length}
        </div>

        <h2>${esc(question.q)}</h2>

        ${mediaHTML(question)}

        <div id="answerArea" class="hidden ok">
          <b>Answer:</b>
          <p style="margin:7px 0 0">${esc(question.a)}</p>
        </div>

        <div class="modalactions">
          <button class="soft" id="reveal">Show answer</button>
          <button class="good" id="correct">Correct!</button>
          <button class="danger" id="wrong">Incorrect</button>
          <button class="white" id="close">Close</button>
        </div>

        <div class="field" style="margin-top:15px">
          <label>Award points to</label>
          <div style="display:flex;gap:8px">
            <select id="awardTeam">
              ${teams.map((team, teamIndex) => `
                <option value="${teamIndex}">${esc(team.name)}</option>
              `).join('')}
            </select>

            <input
              id="awardPoints"
              type="number"
              value="10"
              style="max-width:100px"
            >

            <button class="primary" id="award">Apply</button>
          </div>
        </div>
      </div>
    </div>
  `;

  root.querySelector('#reveal').onclick = () => {
    answerVisible = !answerVisible;

    root.querySelector('#answerArea')
      .classList.toggle('hidden', !answerVisible);

    root.querySelector('#reveal').textContent =
      answerVisible ? 'Hide answer' : 'Show answer';
  };

  root.querySelector('#correct').onclick = async () => {
    if (teams[0]) teams[0].score += 10;
    await finishQuestion(index);
  };

  root.querySelector('#wrong').onclick = async () => {
    await finishQuestion(index);
  };

  root.querySelector('#close').onclick = () => {
    root.innerHTML = '';
  };

  root.querySelector('#award').onclick = async () => {
    const teamIndex = Number(root.querySelector('#awardTeam').value);
    const points = Number(root.querySelector('#awardPoints').value);

    if (!teams[teamIndex] || !Number.isFinite(points)) {
      alert('Select a team and enter valid points.');
      return;
    }

    teams[teamIndex].score += points;

    await finishQuestion(index);
  };
}

// Savolni yakunlash
async function finishQuestion(index) {
  if (!used.includes(index)) {
    used.push(index);
  }

  $('modalRoot').innerHTML = '';

  renderPlay();
  await syncRoom();
}

// Xona kodini ko‘rsatish
$('copyRoom').onclick = async () => {
  if (!roomCode) {
    alert('No room code is available.');
    return;
  }

  try {
    await navigator.clipboard.writeText(roomCode);
    alert('Room code copied: ' + roomCode);
  } catch {
    alert('Room code: ' + roomCode);
  }
};

// O‘yinlar kutubxonasiga qaytish
$('backLibrary').onclick = () => {
  stopRoomSync();

  current = null;
  roomCode = '';
  used = [];
  teams = [];
  sessionRole = 'teacher';

  nav('library');
};

// Xonaga qo‘shilish
$('joinBtn').onclick = async () => {
  const code = $('joinCode').value.trim().toUpperCase();
  const name = $('playerName').value.trim() || 'Student';
  const result = $('joinResult');

  if (!code) {
    result.textContent = 'Enter a room code.';
    return;
  }

  if (!supabase) {
    result.textContent =
      'Online mode is unavailable. Check the Supabase configuration.';
    return;
  }

  result.textContent = 'Connecting to room...';

  try {
    const { data, error } = await supabase
      .from('rooms')
      .select('code, game, teams, used, status')
      .eq('code', code)
      .eq('status', 'active')
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      result.textContent = 'Room not found. Check the code and try again.';
      return;
    }

    stopRoomSync();

    roomCode = data.code;
    current = data.game;
    teams = data.teams || [];
    used = data.used || [];

    sessionRole = 'student';
    sessionName = name;

    nav('play');
    renderPlay();

    $('roomInfo').textContent = 'Joined as ' + sessionName;

    startRoomSync();
  } catch (error) {
    console.error('Join room failed:', error);

    result.textContent = 'Connection error: ' + error.message;
  }
};

// Dastlabki holat
stats();
renderHome();
renderLibrary();
</script>
